
name: Build WRAITH 0.6 VST3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  windows:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build both VST3 plugins
        run: cmake --build build --config Release --target WRAITH_Instrument_VST3 WRAITH_FX_VST3 --parallel 4

      - name: Package VST3 plugins
        shell: pwsh
        run: |
          $plugins = @(Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3")

          if ($plugins.Count -lt 2) {
            throw "Expected 2 VST3 plugins, found $($plugins.Count)"
          }

          New-Item -ItemType Directory -Path package -Force | Out-Null

          foreach ($plugin in $plugins) {
            Copy-Item -LiteralPath $plugin.FullName -Destination package -Recurse -Force
          }

          Compress-Archive -Path "package/*" -DestinationPath "WRAITH-0.6-Windows-VST3.zip" -Force

      - name: Upload VST3 archive
        uses: actions/upload-artifact@v4
        with:
          name: WRAITH-0.6-Windows-VST3
          path: WRAITH-0.6-Windows-VST3.zip
          if-no-files-found: error
