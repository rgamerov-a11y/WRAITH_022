
name: Build WRAITH 0.5 VST3 (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build VST3 0.5
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      
- name: Package WRAITH 0.6 VST3
  shell: pwsh
  run: |
    $plugins = @(Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3")

    if ($plugins.Count -lt 2) {
      throw "Expected 2 VST3 plugins, found $($plugins.Count)"
    }

    New-Item -ItemType Directory -Path package -Force | Out-Null

    foreach ($plugin in $plugins) {
      Copy-Item -LiteralPath $plugin.FullName -Destination package -Recurse -Force
      Write-Host "Packaged: $($plugin.Name)"
    }

    Compress-Archive -Path "package/*" `
      -DestinationPath "WRAITH-0.6-VST3-Windows-x64.zip" -Force


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WRAITH-0.5-VST3-Windows-x64
          path: WRAITH-0.5-VST3-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
